# Codemagic CI/CD configuration — Rosta (StaffSaaSMobile)
#
# Single workflow:
#   * ios-release  → archive + export an App Store .ipa (TestFlight / App Store)
#
# ─────────────────────────────────────────────────────────────────────────────
# REQUIRED CODEMAGIC SETUP (do this once in the Codemagic UI)
# ─────────────────────────────────────────────────────────────────────────────
#
# 1. App Store Connect integration (iOS signing)
#    Team settings → Integrations → App Store Connect → add an API key.
#    Name it exactly: `app_store_connect_ro` (or rename it below to match).
#    Codemagic uses it to create/download provisioning profiles automatically
#    (automatic code signing) — no manual profiles needed.
#
# 2. Environment variable group `ro_secrets` (encrypted) containing:
#      ENV_FILE_PRODUCTION_B64    → base64 of your `.env.production`
#      GOOGLE_SERVICE_INFO_B64    → base64 of ios/StaffSaaSMobile/GoogleService-Info.plist
#
#    Generate each Base64 value locally (macOS/Linux):
#      base64 -i .env.production | pbcopy
#      base64 -i ios/StaffSaaSMobile/GoogleService-Info.plist | pbcopy
#    On Windows PowerShell:
#      [Convert]::ToBase64String([IO.File]::ReadAllBytes(".env.production")) | Set-Clipboard
#
# NOTE: The Firebase plist is gitignored, so without GOOGLE_SERVICE_INFO_B64 the
# build will succeed but push notifications will be DEAD in the shipped app
# (AppDelegate guards FirebaseApp.configure() behind a file-existence check).
# ─────────────────────────────────────────────────────────────────────────────

workflows:
  # ───────────────────────────────────────────────────────────────────────────
  # iOS — App Store / TestFlight
  # ───────────────────────────────────────────────────────────────────────────
  ios-release:
    name: iOS Release
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      # Must match the App Store Connect API key name you create in the UI.
      app_store_connect: codemagicKey
    environment:
      # Node 22 is required by package.json's engines field.
      node: 22.11.0
      xcode: latest
      cocoapods: default
      groups:
        - ro_secrets
      vars:
        # Which dotenv file react-native-config injects. Its contents are
        # written to `.env` by the "Inject environment" script below.
        ENVFILE: .env
        BUNDLE_ID: com.staffsaasmobile
        XCODE_WORKSPACE: ios/StaffSaaSMobile.xcworkspace
        XCODE_SCHEME: StaffSaaSMobile
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v*'
          include: true
    scripts:
      - name: Install JavaScript dependencies
        script: |
          set -e
          npm ci

      - name: Quality gates (lint, typecheck, tests)
        script: |
          set -e
          npm run lint
          npm run typecheck
          npm test -- --ci

      - name: Inject environment (react-native-config)
        script: |
          set -e
          # Fail with a clear message if the secret is absent — otherwise `base64`
          # silently decodes nothing and produces an empty `.env`.
          if [ -z "$ENV_FILE_PRODUCTION_B64" ]; then
            echo "ERROR: ENV_FILE_PRODUCTION_B64 is empty or not set." >&2
            echo "Add it to the ro_secrets Codemagic variable group (Teams → Global variables)." >&2
            exit 1
          fi
          # Strip any surrounding whitespace/newlines the UI may have captured, then
          # decode. `-d` and `--decode` are equivalent; `-i` tolerates stray newlines
          # inside the value if the secret was pasted in wrapped form.
          printf '%s' "$ENV_FILE_PRODUCTION_B64" | tr -d '\r\n ' | base64 -d -i > .env
          echo "[env] wrote $(wc -l < .env) lines to .env"
          # Fail loudly if the production backend host is missing.
          grep -q '^API_BASE_URL=' .env || {
            echo "ERROR: API_BASE_URL missing from decoded .env" >&2
            echo "First 5 lines of .env:" >&2
            head -n 5 .env >&2
            exit 1
          }

      - name: Inject Firebase plist (iOS push config)
        script: |
          set -e
          if [ -z "$GOOGLE_SERVICE_INFO_B64" ]; then
            echo "ERROR: GOOGLE_SERVICE_INFO_B64 is empty or not set." >&2
            echo "Add it to the ro_secrets Codemagic variable group (Teams → Global variables)." >&2
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICE_INFO_B64" | tr -d '\r\n ' | base64 -d -i > ios/StaffSaaSMobile/GoogleService-Info.plist
          test -s ios/StaffSaaSMobile/GoogleService-Info.plist
          # Confirm it is a real plist, not an empty decode.
          plutil -lint ios/StaffSaaSMobile/GoogleService-Info.plist

      - name: Set up code signing (automatic)
        script: |
          set -e
          keychain initialize
          # Fetches/creates the App Store distribution certificate + profile for
          # the bundle id, using the App Store Connect integration above.
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles

      - name: Install CocoaPods dependencies
        script: |
          set -e
          cd ios
          pod install --repo-update

      - name: Build iOS .ipa
        script: |
          set -e
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - '*.dSYM.zip'
      - '*.dSYM'

    publishing:
      # Upload to TestFlight (App Store Connect) automatically on a v* tag.
      # The build still has to be submitted for review manually unless you add
      # `submit` / `cancel_previous_submissions` options here.
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # Set to true to push straight to App Store review instead of TestFlight:
        # submit_to_app_store: false
      email:
        recipients:
          - yasoo70bhnan@gmail.com
        notify:
          success: true
          failure: true
