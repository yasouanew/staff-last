# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# Default value: -Xmx512m -XX:MaxMetaspaceSize=256m
#
# NOTE ON SIZE: R8 (which now runs for release builds) is memory-hungry, but this
# machine could not reserve a 4 GB G1 heap — the daemon died with
#   "Native memory allocation (mmap) failed to map 775946240 bytes for G1 virtual space"
# during `:app:minifyReleaseWithR8`. 3 GB completes the task here with headroom
# for the Kotlin/metaclass overhead, while still leaving the OS room to breathe.
# Raise to 4096m only on machines with >8 GB RAM; lower to 2048m if this still OOMs.
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m -XX:+HeapDumpOnOutOfMemoryError

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true

# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true

# Use this property to specify which architecture you want to build.
# You can also override it from the CLI using
# ./gradlew <task> -PreactNativeArchitectures=x86_64
reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64

# Use this property to enable support to the new architecture.
# This will allow you to use TurboModules and the Fabric render in
# your application. You should enable this flag either if you want
# to write custom TurboModules/Fabric components OR use libraries that
# are providing them.
newArchEnabled=true

# Use this property to enable or disable the Hermes JS engine.
# If set to false, you will be using JSC instead.
hermesEnabled=true

# Use this property to enable edge-to-edge display support.
# This allows your app to draw behind system bars for an immersive UI.
# Note: Only works with ReactActivity and should not be used with custom Activity.
edgeToEdgeEnabled=true

# Opt out of built-in kotlin and new DSL behavior that ships with AGP 9.
# Starting from AGP 10.x these opt outs will be removed.
android.builtInKotlin=false
android.newDsl=false

# ---------------------------------------------------------------------------
# R8 / release optimisation
#
# Google Play's "DEX code optimisation" report flagged this app at 2%
# obfuscation and 23.8 MB of uncompressed DEX, with "No R8 metadata included".
# R8 itself is enabled via `minifyEnabled true` in app/build.gradle; the
# properties below make it do the aggressive job Play expects.
# ---------------------------------------------------------------------------

# Full mode removes more code and rewrites more bytecode than the legacy
# default. React Native's own keep rules are full-mode aware, and the extra
# rules in app/proguard-rules.pro cover the native modules used here.
android.enableR8.fullMode=true

# NOTE: `android.enableR8.libraries` was REMOVED in AGP 7.0 (it now defaults to
# true) and setting it only produces a deprecation warning, so it is deliberately
# omitted. Mapping output is what supplies Play's R8 metadata; it is written by
# default for minified release builds and must be archived per upload.

# Compile the release AAB/APK against the non-debug runtime so debug-only
# code paths (and their classes) can be shrunk away.
android.enableResourceOptimizations=true

# ---------------------------------------------------------------------------
# Release signing configuration (Google Play upload)
#
# These properties are consumed by the `signingConfigs.release` block in
# android/app/build.gradle. The referenced keystore lives at
# android/app/my-upload-key.keystore.
#
# IMPORTANT: The real store/key passwords and keystore file must NOT be
# committed to version control. Move these secrets to a local, gitignored
# file (e.g. ~/.gradle/gradle.properties) or your CI secret store before
# publishing.
# ---------------------------------------------------------------------------
MYAPP_UPLOAD_STORE_FILE=my-upload-key.keystore
MYAPP_UPLOAD_KEY_ALIAS=my-key-alias
MYAPP_UPLOAD_STORE_PASSWORD=changeit
MYAPP_UPLOAD_KEY_PASSWORD=changeit

# ---------------------------------------------------------------------------
# Windows long-path (MAX_PATH) workaround.
#
# CMake/Ninja object-file paths for react-native-gesture-handler's codegen on
# Windows can exceed the 260-character limit, failing with:
#   "ninja: error: Stat(...): Filename longer than 260 characters"
# This flag lets AGP use short/long-path-aware handling so the native build
# (arm64-v8a and other ABIs) can complete. Requires the OS long-path policy
# to be enabled (see README); harmless on other platforms.
# ---------------------------------------------------------------------------
android.overridePathCheck=true