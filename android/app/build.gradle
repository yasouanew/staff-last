apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * Windows MAX_PATH (260-char) workaround for CMake/Ninja.
 *
 * react-native-gesture-handler's codegen shadow-node object path exceeds the
 * Windows 260-character limit when the project lives at a deep path such as
 * `c:\laragon\www\StaffSaaSMobile\...`, failing the release native build with:
 *   "ninja: error: Stat(...): Filename longer than 260 characters"
 *
 * When the `RN_SHORT_BUILD_DIR` environment variable is set (e.g. `C:\rnbuild`),
 * relocate the app's build directory AND the CMake/Ninja `.cxx` staging
 * directory to that short root. Both must move, because AGP writes native
 * intermediates to `<app>/.cxx` (a sibling of `build/`, not under it), and that
 * path is the one that overflows. This is opt-in: with the variable absent,
 * normal developer builds are completely unaffected.
 */
def shortBuildRoot = System.getenv("RN_SHORT_BUILD_DIR")
if (shortBuildRoot != null && !shortBuildRoot.trim().isEmpty()) {
    def shortRootFile = file(shortBuildRoot.trim())
    rootProject.allprojects { p ->
        if (p.plugins.hasPlugin("com.android.application")) {
            // Move the Java/JS/resource build outputs.
            p.layout.buildDirectory.set(new File(shortRootFile, p.name))
            // Move the CMake/Ninja (.cxx) native intermediates too.
            p.afterEvaluate {
                try {
                    p.android.externalNativeBuild.cmake.buildStagingDirectory =
                        new File(shortRootFile, "${p.name}-cxx")
                } catch (ignored) {
                    // Older AGP DSL: fall back to the legacy property.
                    p.ext.buildStagingDirectory = new File(shortRootFile, "${p.name}-cxx")
                }
            }
        }
    }
}

/**
 * Google Services plugin.
 *
 * Applied conditionally, matching `settings.gradle`: it hard-fails the build when
 * `google-services.json` is absent, and that file is gitignored (per-environment
 * Firebase identifiers). Conditional application keeps `npm run android` working for
 * contributors without Firebase credentials while still shipping a real integration
 * for those who have them.
 */
if (file("google-services.json").exists()) {
    apply plugin: "com.google.gms.google-services"
}

/**
 * react-native-config reads the `.env*` files from the project root and generates
 * `BuildConfig` entries consumed by the native module.
 *
 * `project.env.get(...)` returns `null` when a key is missing, so every access is
 * guarded with `?:"…"` to keep the build working before a developer creates their
 * local `.env` (see `.env.example`).
 */
apply from: project(':react-native-config').projectDir.getPath() + "/dotenv.gradle"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. Default is "debug", "debugOptimized".
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "liteDebugOptimized", "prodDebug", "prodDebugOptimized"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Whether to run R8 on release builds (minify + obfuscate Java/Kotlin bytecode).
 *
 * MUST stay `true`. Google Play's DEX code-optimisation report flags apps below
 * 25% obfuscation, and a previous closed-test upload scored 2% with a 23.8 MB
 * uncompressed DEX because this was `false`. All the flags below
 * (minifyEnabled, shrinkResources, proguardFiles) are inert without it.
 *
 * See docs/android-release-optimisation.md for the verification procedure and
 * the list of keep rules that make this safe for React Native native modules.
 */
def enableProguardInReleaseBuilds = true

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.staffsaasmobile"

    /**
     * Windows MAX_PATH (260-char) workaround for CMake/Ninja.
     *
     * AGP writes native intermediates to <app>/.cxx (a sibling of build/).
     * On Windows with a deep project path this overflows 260 chars, causing:
     *   ninja: error: Stat(...): Filename longer than 260 characters
     *
     * Declaring buildStagingDirectory here (not in afterEvaluate) ensures it
     * is applied before AGP configures CMake so Ninja uses the short root.
     */
    externalNativeBuild {
        cmake {
            buildStagingDirectory "C:\\rnbuild\\cxx"
        }
    }

    defaultConfig {
        applicationId "com.staffsaasmobile"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Keep in sync with package.json "version", Xcode MARKETING_VERSION, and
        // APP_VERSION in the .env files. versionCode must increase on every upload.
        versionCode 5
        versionName "1.0.4"

        /**
         * Restrict the native libraries packaged in release artifacts.
         *
         * Play's own report already shows only `arm64-v8a` and `armeabi-v7a`
         * being delivered to users (19,291 supported devices), yet the build was
         * still producing x86/x86_64 slices that only exist for emulators. This
         * filter drops those two ABIs from `bundleRelease`/`assembleRelease`,
         * cutting build time and the per-ABI native payload without affecting
         * any real device.
         *
         * Debug builds are unaffected: an ABI filter here belongs to the
         * defaultConfig, so we re-add x86/x86_64 for debug below to keep local
         * emulator installs working.
         */
        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a"
        }
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            // These values are read from android/gradle.properties.
            // Keep the credentials out of version control in real deployments.
            if (project.hasProperty('MYAPP_UPLOAD_STORE_FILE')) {
                storeFile file(MYAPP_UPLOAD_STORE_FILE)
                storePassword MYAPP_UPLOAD_STORE_PASSWORD
                keyAlias MYAPP_UPLOAD_KEY_ALIAS
                keyPassword MYAPP_UPLOAD_KEY_PASSWORD
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            /*
             * Re-add the emulator ABIs dropped by the defaultConfig filter so
             * `npm run android` / Android Studio keep working on x86/x86_64
             * images. Debug builds skip JS bundling via `debuggableVariants`.
             */
            ndk {
                abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
            }
        }
        release {
            // Sign release builds with the dedicated Play upload key.
            // see https://reactnative.dev/docs/signed-apk-android.
            signingConfig signingConfigs.release

            /*
             * R8: shrink + obfuscate + optimise. This is what Play's DEX report
             * measures. Reported obfuscation was 2%; anything under 25% risks
             * reduced visibility and publishing capability on Google Play.
             *
             * Keep rules live in app/proguard-rules.pro — React Native, Firebase,
             * Notifee, Reanimated, react-native-config and react-native-keychain
             * all resolve classes and members reflectively and need explicit
             * `-keep` entries or they crash at runtime in release only.
             */
            minifyEnabled enableProguardInReleaseBuilds
            shrinkResources enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"

            /*
             * R8 keeps this off by default. `testCoverageEnabled` and the
             * debuggable flags must stay false so R8 removes debug hooks and the
             * DEX optimiser is allowed to produce optimised code.
             */
            debuggable false
            jniDebuggable false
            testCoverageEnabled false
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }

    /**
     * Firebase.
     *
     * The BoM pins every `com.google.firebase:*` coordinate to one consistent set of
     * versions, so individual dependencies below intentionally omit versions.
     *
     * `firebase-messaging` is the SDK `@react-native-firebase/messaging` wraps; it is
     * what actually receives FCM pushes and is therefore required for the native module
     * to have anything to bind to.
     */
    implementation(platform("com.google.firebase:firebase-bom:34.18.0"))
    implementation("com.google.firebase:firebase-messaging")
}
